<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Event Management System</title>

    <style>
        :root {
            --bg: #eeeae9;
            --surface: #eeeae9;

            --text: #303238;
            --text-soft: #77777d;
            --text-light: #9a999e;

            --shadow-dark: #c7c1c0;
            --shadow-light: #ffffff;

            --accent: #ef5757;
            --accent-dark: #d94343;
            --accent-soft: rgba(239, 87, 87, 0.13);

            --success: #4fa77f;
            --danger: #dc555d;

            --transition: 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        input,
        textarea {
            outline: none;
        }

        #app {
            min-height: 100vh;
        }

        .screen {
            min-height: 100vh;
            padding: 30px 20px;
        }

        .center-screen {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: min(460px, 100%);
            margin: auto;
        }

        .wide-container {
            width: min(1100px, 100%);
            margin: auto;
        }

        /* =========================
           BRAND
        ========================= */

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 35px;
        }

        .brand-icon {
            width: 55px;
            height: 55px;

            border-radius: 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--accent);
            font-size: 18px;
            font-weight: 900;

            background: var(--surface);

            box-shadow:
                7px 7px 15px var(--shadow-dark),
                -7px -7px 15px var(--shadow-light);
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 800;
        }

        .brand p {
            margin-top: 3px;
            color: var(--text-soft);
            font-size: 12px;
        }

        /* =========================
           LANDING
        ========================= */

        .landing {
            text-align: center;
        }

        .landing .brand {
            justify-content: center;
        }

        .landing > h1 {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: -1.5px;
        }

        .landing > h2 {
            margin-top: 3px;
            color: var(--accent);
            font-size: 27px;
            font-weight: 800;
        }

        .landing-description {
            max-width: 390px;
            margin: 18px auto 30px;

            color: var(--text-soft);
            font-size: 14px;
            line-height: 1.7;
        }

        /* =========================
           BUTTON
        ========================= */

        .btn {
            min-height: 50px;
            padding: 0 22px;

            border-radius: 14px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            font-size: 14px;
            font-weight: 700;

            color: white;
            background: var(--accent);

            box-shadow:
                7px 7px 15px var(--shadow-dark),
                -7px -7px 15px var(--shadow-light);

            transition:
                transform var(--transition),
                background var(--transition);
        }

        .btn.full {
            width: 100%;
        }

        .btn:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);

            box-shadow:
                inset 4px 4px 9px var(--shadow-dark),
                inset -4px -4px 9px var(--shadow-light);
        }

        .btn.outline {
            color: var(--accent);
            background: var(--surface);
        }

        .btn.danger {
            color: var(--danger);
            background: var(--surface);
        }

        .logout {
            min-height: 42px;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .back-btn {
            width: 45px;
            height: 45px;

            border-radius: 14px;

            background: var(--surface);
            color: var(--text);

            font-size: 20px;

            box-shadow:
                6px 6px 13px var(--shadow-dark),
                -6px -6px 13px var(--shadow-light);
        }

        .back-btn:hover {
            color: var(--accent);
        }

        /* =========================
           LOGIN / REGISTER
        ========================= */

        .page-title {
            font-size: 30px;
            font-weight: 900;
        }

        .page-subtitle {
            margin: 7px 0 28px;
            color: var(--text-soft);
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 700;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;

            border: none;
            border-radius: 14px;

            color: var(--text);
            background: var(--surface);

            box-shadow:
                inset 5px 5px 11px var(--shadow-dark),
                inset -5px -5px 11px var(--shadow-light);
        }

        .form-group input {
            height: 51px;
            padding: 0 16px;
        }

        .form-group textarea {
            min-height: 100px;
            padding: 14px 16px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            box-shadow:
                inset 5px 5px 11px var(--shadow-dark),
                inset -5px -5px 11px var(--shadow-light),
                0 0 0 2px var(--accent-soft);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--text-light);
        }

        /* =========================
           PASSWORD EYE
        ========================= */

        .input-wrap {
            position: relative;
        }

        .password-input {
            padding-right: 52px !important;
        }

        .password-toggle {
            position: absolute;

            top: 50%;
            right: 14px;

            width: 28px;
            height: 28px;

            transform: translateY(-50%);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            background: transparent;
            color: var(--text-soft);
        }

        .password-toggle:hover {
            color: var(--accent);
        }

        .eye-icon {
            width: 19px;
            height: 19px;

            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .password-toggle.show {
            color: var(--accent);
        }

        /* =========================
           TEXT BUTTON
        ========================= */

        .center-text {
            text-align: center;
        }

        .text-btn {
            margin-top: 17px;

            color: var(--accent);
            background: transparent;

            font-size: 13px;
            font-weight: 700;
        }

        .text-btn:hover {
            color: var(--accent-dark);
        }

        /* =========================
           STUDENT
        ========================= */

        .student-header,
        .dashboard-head {
            margin-bottom: 35px;
        }

        .student-header h1,
        .dashboard-head h1 {
            font-size: 30px;
            font-weight: 900;
        }

        .muted,
        .event-count {
            margin-top: 5px;
            color: var(--text-soft);
            font-size: 13px;
        }

        .section-title {
            margin-bottom: 18px;
            font-size: 21px;
        }

        /* =========================
           EVENT CARD
        ========================= */

        .event-card {
            margin-bottom: 20px;
            padding: 24px;

            border-radius: 22px;

            background: var(--surface);

            box-shadow:
                9px 9px 20px var(--shadow-dark),
                -9px -9px 20px var(--shadow-light);

            transition: transform var(--transition);
        }

        .event-card:hover {
            transform: translateY(-3px);
        }

        .event-title {
            margin-bottom: 17px;
            font-size: 19px;
        }

        .info-row {
            display: flex;
            gap: 9px;

            margin: 9px 0;

            color: var(--text-soft);
            font-size: 13px;
        }

        .event-description {
            margin: 17px 0;

            color: var(--text-soft);
            font-size: 13px;
            line-height: 1.6;
        }

        .card-actions {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .card-actions .btn {
            flex: 1;
        }

        .empty {
            padding: 40px;

            text-align: center;

            border-radius: 20px;

            color: var(--text-soft);
            background: var(--surface);

            box-shadow:
                8px 8px 18px var(--shadow-dark),
                -8px -8px 18px var(--shadow-light);
        }

        /* =========================
           ADMIN
        ========================= */

        .dashboard-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        /* =========================
           MODAL
        ========================= */

        .modal-backdrop {
            position: fixed;
            inset: 0;

            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(40, 40, 45, 0.45);
        }

        .modal {
            width: min(500px, 100%);
            max-height: 90vh;
            overflow-y: auto;

            padding: 28px;

            border-radius: 25px;

            background: var(--surface);

            box-shadow:
                12px 12px 28px rgba(0, 0, 0, 0.22),
                -8px -8px 20px var(--shadow-light);
        }

        .modal h2 {
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions .btn {
            flex: 1;
        }

        /* =========================
           PARTICIPANTS
        ========================= */

        .participant {
            display: flex;
            align-items: center;
            gap: 13px;

            padding: 13px;
            margin-bottom: 10px;

            border-radius: 14px;

            background: var(--surface);

            box-shadow:
                5px 5px 11px var(--shadow-dark),
                -5px -5px 11px var(--shadow-light);
        }

        .avatar {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--accent);
            font-weight: 800;

            box-shadow:
                inset 4px 4px 8px var(--shadow-dark),
                inset -4px -4px 8px var(--shadow-light);
        }

        .participant-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .participant-info strong {
            font-size: 13px;
        }

        .participant-info span {
            color: var(--text-soft);
            font-size: 11px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .screen {
                padding: 25px 17px;
            }

            .landing > h1 {
                font-size: 34px;
            }

            .landing > h2 {
                font-size: 23px;
            }

            .dashboard-head {
                align-items: flex-start;
                flex-direction: column;
            }

            .dashboard-head > div:last-child {
                width: 100%;
            }

            .dashboard-head > div:last-child .btn {
                flex: 1;
            }

            .card-actions {
                flex-direction: column;
            }

            .card-actions .btn {
                width: 100%;
            }

            .modal {
                padding: 22px;
            }

            .modal-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div id="app"></div>

    <script src="app.js"></script>

</body>
</html>
